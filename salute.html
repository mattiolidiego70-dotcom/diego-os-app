<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Salute · Diego OS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icona-180.png">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600&family=Spline+Sans+Mono:wght@400;500&display=swap">
<style>
/* ═══ TOKEN — un solo :root, nessun colore a mano nei componenti ═══ */
:root{
  --fondo:#050505;
  --fondo-desktop:radial-gradient(120% 110% at 12% 4%,#A3FF0022 0%,#0d0d0d 30%,#060606 68%,#020202 100%);
  --fondo-mobile:radial-gradient(120% 70% at 25% 0%,#A3FF0026 0%,#0d0d0d 34%,#060606 70%,#020202 100%);
  --vetro:rgba(var(--luce-rgb),.06);
  --vetro-forte:rgba(var(--luce-rgb),.07);
  --vetro-filtro:blur(40px) saturate(180%);
  --vetro-filtro-forte:blur(44px) saturate(200%);
  --bordo:rgba(var(--luce-rgb),.12);
  --bordo-forte:rgba(var(--luce-rgb),.14);
  --luce-interna:inset 0 1px 0 rgba(var(--luce-rgb),.07);
  --riga:rgba(var(--luce-rgb),.06);
  --luce-rgb:255,255,255;
  --ombra-rgb:0,0,0;
  --accento-rgb:163,255,0;
  --attenzione-rgb:255,176,32;
  --viola-rgb:168,85,247;
  --inchiostro-rgb:11,18,0;
  --superficie-rgb:20,20,24;
  --velo-rgb:6,6,8;
  --accento:#A3FF00;
  --accento-2:#8FE000;
  --accento-fondo:rgba(var(--accento-rgb),.18);
  --accento-fondo-16:rgba(var(--accento-rgb),.16);
  --accento-bordo:rgba(var(--accento-rgb),.4);
  --accento-45:rgba(var(--accento-rgb),.45);
  --attenzione:#ffb020;
  --testo1:#F5F5F7;
  --testo2:#C7C7CC;
  --testo3:#8E8E93;
  --testo4:#6b6a68;
  --testo5:#4d4c4a;
  --inchiostro-su-lime:#0b1200;
  --sfera:#2b1b4d;
  --sfera-rosa:#f0abfc;
  --sfera-blu:#60a5fa;
  --alone-lime:rgba(var(--accento-rgb),.12);
  --alone-viola:rgba(var(--viola-rgb),.10);
  --barra-fondo:rgba(var(--luce-rgb),.09);
  --tacca-vuota:rgba(var(--luce-rgb),.14);
  --ombra-hover:0 16px 34px rgba(var(--ombra-rgb),.5);
  --ombra-alfred:0 18px 44px rgba(var(--ombra-rgb),.5);
  --ombra-finestra:0 40px 90px rgba(9,5,20,.6),0 0 0 1px rgba(var(--luce-rgb),.22);
  --font-ui:'Sora',system-ui,sans-serif;
  --font-mono:'Spline Sans Mono',ui-monospace,monospace;
  --r-scheda:16px;
  --r-chip:10px;
  --r-chip-s:6px;
  --r-barra:4px;
  --transizione:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease;
}

/* ═══ FASE 2 — le tre direzioni nuove. Si cambia la pelle, non lo scheletro:
   ogni blocco riscrive SOLO i token di colore, zero regole di layout. ═══ */

/* A · INCHIOSTRO — blu-nero profondo, neutri freddi, accento acciaio */
html[data-pelle="inchiostro"]{
  --fondo:#080B11;
  --fondo-desktop:radial-gradient(120% 110% at 12% 4%,#7AA2F733 0%,#0e131c 30%,#080b11 68%,#04060a 100%);
  --fondo-mobile:radial-gradient(120% 70% at 25% 0%,#7AA2F72e 0%,#0e131c 34%,#080b11 70%,#04060a 100%);
  --accento:#7AA2F7;
  --accento-rgb:122,162,247;
  --attenzione-rgb:242,177,85;
  --viola-rgb:94,234,212;
  --inchiostro-rgb:5,8,15;
  --superficie-rgb:14,19,28;
  --velo-rgb:4,6,10;
  --accento-2:#5B8DEF;
  --accento-fondo:rgba(122,162,247,.18);
  --accento-fondo-16:rgba(122,162,247,.16);
  --accento-bordo:rgba(122,162,247,.42);
  --accento-45:rgba(122,162,247,.45);
  --attenzione:#F2B155;
  --testo1:#E8ECF4;
  --testo2:#AEB8CC;
  --testo3:#76819A;
  --testo4:#5B6579;
  --testo5:#434B5C;
  --inchiostro-su-lime:#05080f;
  --sfera:#1b2a4d;
  --sfera-rosa:#9db4f7;
  --sfera-blu:#5eead4;
  --alone-lime:rgba(122,162,247,.14);
  --alone-viola:rgba(94,234,212,.09);
}

/* B · BRONZO — grafite calda, accento ambra: la piu' calda delle tre */
html[data-pelle="bronzo"]{
  --fondo:#100F0E;
  --fondo-desktop:radial-gradient(120% 110% at 12% 4%,#E8894A2b 0%,#17140f 30%,#100f0e 68%,#070605 100%);
  --fondo-mobile:radial-gradient(120% 70% at 25% 0%,#E8894A26 0%,#17140f 34%,#100f0e 70%,#070605 100%);
  --accento:#E8894A;
  --accento-rgb:232,137,74;
  --attenzione-rgb:227,198,90;
  --viola-rgb:158,199,180;
  --inchiostro-rgb:20,11,4;
  --superficie-rgb:23,20,15;
  --velo-rgb:7,6,5;
  --accento-2:#C96F37;
  --accento-fondo:rgba(232,137,74,.18);
  --accento-fondo-16:rgba(232,137,74,.16);
  --accento-bordo:rgba(232,137,74,.42);
  --accento-45:rgba(232,137,74,.45);
  --attenzione:#E3C65A;
  --testo1:#F4F0EB;
  --testo2:#C9BFB3;
  --testo3:#938A7E;
  --testo4:#6F675D;
  --testo5:#524C44;
  --inchiostro-su-lime:#140b04;
  --sfera:#3a2416;
  --sfera-rosa:#f0b49a;
  --sfera-blu:#9ec7b4;
  --alone-lime:rgba(232,137,74,.13);
  --alone-viola:rgba(158,199,180,.09);
}

/* C · CARTA — chiara, per quando apri l'app di giorno. I veli si invertono:
   --luce-rgb diventa inchiostro, quindi i 59 rgba dei componenti si scuriscono da soli. */
html[data-pelle="carta"]{
  --luce-rgb:17,20,26;
  --fondo:#F5F4F1;
  --fondo-desktop:radial-gradient(120% 110% at 12% 4%,#2E5AAC14 0%,#f7f6f3 30%,#f2f1ee 68%,#eceae6 100%);
  --fondo-mobile:radial-gradient(120% 70% at 25% 0%,#2E5AAC12 0%,#f7f6f3 34%,#f2f1ee 70%,#eceae6 100%);
  --vetro:rgba(255,255,255,.72);
  --vetro-forte:rgba(255,255,255,.84);
  --vetro-filtro:blur(24px) saturate(140%);
  --vetro-filtro-forte:blur(28px) saturate(150%);
  --bordo:rgba(17,20,26,.12);
  --bordo-forte:rgba(17,20,26,.16);
  --luce-interna:inset 0 1px 0 rgba(255,255,255,.9);
  --accento:#2E5AAC;
  --accento-rgb:46,90,172;
  --attenzione-rgb:184,118,26;
  --viola-rgb:180,138,216;
  --inchiostro-rgb:255,255,255;
  --superficie-rgb:250,250,248;
  --velo-rgb:236,234,230;
  --accento-2:#24478A;
  --accento-fondo:rgba(46,90,172,.14);
  --accento-fondo-16:rgba(46,90,172,.12);
  --accento-bordo:rgba(46,90,172,.38);
  --accento-45:rgba(46,90,172,.45);
  --attenzione:#B8761A;
  --testo1:#14171D;
  --testo2:#3C434F;
  --testo3:#6B7280;
  --testo4:#8A909B;
  --testo5:#A8ADB6;
  --inchiostro-su-lime:#FFFFFF;
  --sfera:#dfe4f2;
  --sfera-rosa:#b48ad8;
  --sfera-blu:#3b82f6;
  --alone-lime:rgba(46,90,172,.10);
  --alone-viola:rgba(180,138,216,.10);
  --ombra-hover:0 14px 30px rgba(17,20,26,.12);
  --ombra-alfred:0 16px 38px rgba(17,20,26,.14);
  --ombra-finestra:0 30px 70px rgba(17,20,26,.18),0 0 0 1px rgba(17,20,26,.10);
}

/* il selettore della pelle: vive solo durante la scelta di Fase 2 */
#pelli{position:fixed;z-index:900;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;
  background:var(--vetro-forte);backdrop-filter:var(--vetro-filtro);-webkit-backdrop-filter:var(--vetro-filtro);
  border:1px solid var(--bordo);box-shadow:var(--ombra-hover);font:500 11px var(--font-ui)}
#pelli button{appearance:none;border:1px solid var(--bordo);background:transparent;color:var(--testo3);
  font:500 11px var(--font-ui);padding:5px 9px;border-radius:999px;cursor:pointer;transition:var(--transizione)}
#pelli button[aria-pressed="true"]{background:var(--accento-fondo);border-color:var(--accento-bordo);color:var(--testo1)}
#pelli .eti{color:var(--testo4);padding-left:2px;letter-spacing:.04em;text-transform:uppercase;font-size:9.5px}
@media (max-width:760px){#pelli{bottom:calc(72px + env(safe-area-inset-bottom))}}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{width:0;height:0;display:none}
html,body{margin:0;height:100%}
body{background:var(--fondo);font-family:var(--font-ui);color:var(--testo1);overflow:hidden}
a{color:var(--accento);text-decoration:none}
:focus-visible{outline:2px solid var(--accento);outline-offset:2px;border-radius:6px}
@keyframes deriva{0%{transform:translate(-14%,-8%) scale(1.1)}50%{transform:translate(12%,10%) scale(1.35)}100%{transform:translate(-14%,-8%) scale(1.1)}}
@keyframes deriva2{0%{transform:translate(10%,12%) scale(1.2)}50%{transform:translate(-12%,-10%) scale(1)}100%{transform:translate(10%,12%) scale(1.2)}}
@keyframes onda{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}

/* ═══ COMPONENTI ═══ */
.card{background:linear-gradient(180deg,rgba(var(--luce-rgb),.045),rgba(var(--luce-rgb),.015)),var(--vetro);backdrop-filter:var(--vetro-filtro);-webkit-backdrop-filter:var(--vetro-filtro);
  border:1px solid var(--bordo);border-radius:var(--r-scheda);padding:13px 15px;
  box-shadow:var(--luce-interna),0 8px 24px rgba(var(--ombra-rgb),.22);transition:var(--transizione);
  display:flex;flex-direction:column;gap:7px;min-height:0;min-width:0}
.card:hover{transform:translateY(-3px) scale(1.008);box-shadow:var(--ombra-hover),inset 0 1px 0 rgba(var(--luce-rgb),.12)}
.card:active{transform:translateY(-1px) scale(.997)}
.testa{display:flex;align-items:center;justify-content:space-between;gap:9px}
.testa .tit{color:var(--testo1);font:600 14.5px var(--font-ui);letter-spacing:-.01em}
.etk{color:var(--testo4);font:400 10px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.lettura{border:1px solid var(--bordo-forte);border-radius:8px;padding:3px 9px;color:var(--testo2);font:500 11px var(--font-mono);white-space:nowrap}
.espandi{display:flex;color:var(--accento);cursor:pointer}
.chip{padding:5px 9px;border-radius:8px;border:1px solid var(--bordo);color:var(--testo3);font:400 10.5px var(--font-ui);cursor:pointer;white-space:nowrap;background:none}
.chip.on{background:var(--accento-fondo-16);border-color:var(--accento-bordo);color:var(--accento);font-weight:500}
.riga{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--riga);padding-bottom:3px;gap:8px}
.riga .k{color:var(--testo3);font:400 11.5px var(--font-ui)}
.riga .v{color:var(--testo1);font:500 12px var(--font-mono);text-align:right}
.cliccabile{cursor:pointer;border-radius:6px;transition:background .18s ease}
.cliccabile:hover{background:rgba(var(--luce-rgb),.05)}
.nota{color:var(--testo4);font:400 10.5px/1.4 var(--font-ui)}
.bott{text-align:center;background:var(--accento);color:var(--inchiostro-su-lime);border:none;border-radius:var(--r-chip);padding:9px;font:600 12.5px var(--font-ui);cursor:pointer;width:100%}
.bott2{text-align:center;background:none;border:1px solid rgba(var(--accento-rgb),.35);color:var(--accento);border-radius:var(--r-chip);padding:7px;font:500 12px var(--font-ui);cursor:pointer;width:100%}
.campo{background:none;border:1px solid var(--bordo-forte);border-radius:9px;padding:9px 10px;color:var(--testo1);font:400 12px var(--font-ui);width:100%}
.campo::placeholder{color:var(--testo3)}
.barra{height:6px;border-radius:var(--r-barra);background:var(--barra-fondo);overflow:hidden}
.barra>i{display:block;height:100%;background:var(--accento)}
.mono{font-family:var(--font-mono)}
.sfera{border-radius:50%;position:relative;overflow:hidden;background:var(--sfera);box-shadow:inset 0 1px 1px rgba(var(--luce-rgb),.45);flex:none;display:block}
.sfera i{position:absolute;inset:0;display:block}
.sfera .rosa{background:radial-gradient(closest-side,var(--sfera-rosa),transparent 70%);filter:blur(5px);animation:deriva 5.5s ease-in-out infinite}
.sfera .blu{background:radial-gradient(closest-side,var(--sfera-blu),transparent 70%);filter:blur(6px);animation:deriva2 6.5s ease-in-out infinite}
.tacca{flex:1;border-radius:6px;background:var(--tacca-vuota)}
.tacca.si{background:var(--accento)}
.tacca.dafare{background:rgba(var(--accento-rgb),.10);border:1px dashed rgba(var(--accento-rgb),.5)}
.quadr{width:9px;height:9px;border-radius:2px;background:rgba(var(--luce-rgb),.12);display:block}
.quadr.si{background:var(--accento)}
.spunta{width:16px;height:16px;border-radius:5px;border:1px solid rgba(var(--luce-rgb),.25);background:transparent;flex:none;display:block;cursor:pointer}
.spunta.comprato{background:var(--accento)}
.spunta.celho{background:var(--accento-45)}
.pillstato{border:1px solid var(--bordo);border-radius:var(--r-chip-s);padding:1px 8px;font:400 10px var(--font-ui);color:var(--testo4);white-space:nowrap}
/* bolle 2026: raggio asimmetrico, gradiente sul lime, profondita' soft */
.msg-io{align-self:flex-end;max-width:82%;background:linear-gradient(135deg,var(--accento),var(--accento-2));border-radius:18px 18px 5px 18px;padding:10px 14px;color:var(--inchiostro-su-lime);font:400 13px/1.5 var(--font-ui);box-shadow:0 4px 16px rgba(var(--accento-rgb),.18)}
.msg-coach{align-self:flex-start;max-width:82%;background:rgba(var(--luce-rgb),.055);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(var(--luce-rgb),.08);border-radius:18px 18px 18px 5px;padding:10px 14px;color:var(--testo1);font:400 13px/1.55 var(--font-ui);white-space:pre-wrap;box-shadow:0 2px 12px rgba(var(--ombra-rgb),.25)}

/* ═══ SHELL DESKTOP (>760px) ═══ */
#sfondo{position:fixed;inset:0;background:var(--fondo-desktop)}
.alone{position:absolute;border-radius:50%;pointer-events:none}
#alone1{left:16%;top:-140px;width:560px;height:420px;background:radial-gradient(closest-side,var(--alone-lime),transparent)}
#alone2{right:-80px;bottom:-120px;width:640px;height:520px;background:radial-gradient(closest-side,rgba(var(--accento-rgb),.08),transparent)}
#alone3{left:40%;bottom:-40px;width:520px;height:380px;background:radial-gradient(closest-side,var(--alone-viola),transparent)}
#app{position:fixed;inset:26px;border-radius:16px;overflow:hidden;box-shadow:var(--ombra-finestra);
  display:grid;grid-template-columns:66px 1fr;grid-template-rows:minmax(0,1fr);background:var(--vetro)}
#rail{position:relative;z-index:20;background:rgba(var(--luce-rgb),.05);backdrop-filter:blur(46px) saturate(150%);-webkit-backdrop-filter:blur(46px) saturate(150%);
  border-right:1px solid rgba(var(--luce-rgb),.09);display:flex;flex-direction:column;align-items:center;padding:16px 0 14px}
#rail .logo{width:26px;height:26px;border-radius:8px;background:var(--accento);color:var(--inchiostro-su-lime);display:flex;align-items:center;justify-content:center;font:600 12px var(--font-ui);margin-bottom:18px}
#rail .voce{width:42px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:rgba(var(--luce-rgb),.5);position:relative;cursor:pointer}
#rail .voce.on{background:var(--accento-fondo-16);border:1px solid var(--accento-45);color:var(--accento)}
#rail .voce .nome{display:none;position:absolute;left:52px;top:50%;transform:translateY(-50%);background:rgba(var(--superficie-rgb),.95);border:1px solid var(--bordo);border-radius:8px;padding:4px 10px;color:var(--testo2);font:400 11px var(--font-ui);white-space:nowrap;z-index:40}
#rail .voce:hover .nome{display:block}
#colonna{position:relative;display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,rgba(var(--luce-rgb),.02),rgba(var(--ombra-rgb),.14))}
#testata{position:relative;display:flex;align-items:center;gap:14px;padding:11px 18px;background:var(--vetro);backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);border-bottom:1px solid rgba(var(--luce-rgb),.08);z-index:25}
#testata .modulo{color:var(--testo1);font:500 13.5px var(--font-ui);letter-spacing:-.01em}
/* la pillola col riquadro era brutta (collaudo Diego 13/09): resta SOLO la
   sfera, come la barra chiusa — stesse forme, un tocco apre la barra */
#pillola{position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;cursor:pointer}
#pillola>span:not(.sfera){display:none}
#contesto{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--testo2);font:400 12px var(--font-mono);white-space:nowrap}
#striscia{padding:10px 24px 0}
#tabs{display:inline-flex;padding:3px;border-radius:13px;background:linear-gradient(180deg,rgba(var(--accento-rgb),.10),rgba(var(--accento-rgb),.04));box-shadow:inset 0 1px 0 rgba(var(--luce-rgb),.06),inset 0 0 0 1px rgba(var(--luce-rgb),.06)}
#tabs .tab{padding:7px 15px;border-radius:10px;color:var(--testo3);font:400 12.5px var(--font-ui);cursor:pointer;border:1px solid transparent;background:none;white-space:nowrap}
#tabs .tab.on{background:var(--accento-fondo);border-color:var(--accento-bordo);color:var(--accento);font-weight:500}
#statoriga{display:none;align-items:center;gap:9px;padding:8px 24px 0;color:var(--testo2);font:400 13px var(--font-ui)}
#statoriga.si{display:flex}
/* overflow-y:auto anche su desktop: con una finestra piu' bassa del mockup
   la griglia non si taglia, scorre (collaudo Diego 13/09) */
.pane{display:none;flex:1;min-height:0;overflow-y:auto;padding:8px 24px 84px}
.pane.on{display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:minmax(126px,auto);gap:10px}
.card{overflow:hidden}
/* minimi per riga: sotto quella soglia la PANE scorre invece di tagliare le card */
.pane[data-pane="oggi"].on{grid-template-rows:repeat(5,minmax(134px,1fr))}
.pane[data-pane="corpo"].on,.pane[data-pane="dieta"].on,.pane[data-pane="spesa"].on,.pane[data-pane="coach"].on{grid-template-rows:repeat(3,minmax(212px,1fr))}
.pane[data-pane="obiettivi"].on{grid-template-rows:minmax(235px,1.12fr) minmax(205px,1fr) minmax(138px,.66fr);padding-top:0}
.pane[data-pane="brain"].on{grid-template-rows:minmax(205px,1fr) minmax(205px,1fr) minmax(252px,1.22fr)}
#diario30{display:none;align-items:center;gap:12px;padding:6px 24px 14px;border-top:1px solid rgba(var(--luce-rgb),.08)}
#diario30.si{display:flex}
#barraAlfred{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);width:660px;background:var(--vetro);backdrop-filter:var(--vetro-filtro-forte);-webkit-backdrop-filter:var(--vetro-filtro-forte);border:1px solid var(--bordo-forte);border-radius:16px;padding:11px 14px;box-shadow:var(--ombra-alfred),inset 0 1px 0 rgba(var(--luce-rgb),.09);z-index:70;
  transition:width .28s cubic-bezier(.2,.8,.2,1),padding .28s ease,border-radius .28s ease,left .28s ease,transform .28s ease}
#barraAlfred .dentro{display:flex;align-items:center;gap:11px}
/* la barra si CHIUDE nella sfera quando non la usi: resta solo la pallina,
   CENTRATA in basso, un tocco la riapre (collaudo Diego 13/09, x2) */
#barraAlfred.chiusa{width:58px;padding:6px;border-radius:50%;left:50%;transform:translateX(-50%);cursor:pointer}
#barraAlfred.chiusa .dentro{justify-content:center;gap:0}
#barraAlfred.chiusa .dentro>*:not(.sfera){display:none !important}

     1700px dentro un overflow:hidden e la pagina "non scorreva" (collaudo
     Diego 13/09): barra e dock finivano invisibili sotto il taglio */
  /* CATENA DELLE LARGHEZZE (14/09, gemella di quella delle altezze): un
     flex item ha min-width:auto e si allarga col contenuto - un solo
     badge nowrap allargava colonna, pane e OGNI card oltre lo schermo */

  .pane.on{display:flex;flex-direction:column;overflow-y:auto;gap:9px;padding-bottom:170px}
  /* REGOLA CRITICA (gia' sbagliata una volta): ogni scheda figlia flex:none */
  .pane.on>*{flex:none !important;grid-column:auto !important;grid-row:auto !important}
  /* REV GRAFICA 14/09 - CONTENIMENTO: i badge nowrap (es. «18 mar · 124,5»)
     davano alle card un min-content piu' largo del telefono e TUTTO
     sfondava a destra (bolle chat comprese). Nessuna card puo' superare
     lo schermo; cio' che non ci sta si tronca con i puntini, non taglia
     la pagina. */
  .pane.on>*{max-width:100% !important;min-width:0;overflow:hidden !important}
  /* i min-content dei flex (7 pillole, 26 celle heatmap, badge nowrap)
     devono potersi SCHIACCIARE: senza questo il figlio detta la larghezza */
  .pane.on>* *{min-width:0}

  .pane[data-pane="oggi"].ordine-mockup>[data-blocco="allenamenti"]{order:1}

  .pane[data-pane="oggi"].ordine-mockup>[data-blocco="cuore"]{order:6}
  .pane[data-pane="oggi"].ordine-mockup>[data-blocco="check"]{order:7}

<script>
/* ═══ NUCLEO — stessi pattern della pagina precedente (token, api, esc) ═══ */
var API_BASE='https://icsafmrkndgdksybagky.supabase.co/functions/v1/health-app';
var TOK=localStorage.getItem('app_token')||localStorage.getItem('dos_token')||'';
function esc(x){return String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function api(p,corpo){
  /* il flag serve perché l'abort può scattare anche mentre si legge il CORPO
     della risposta: il segnale copre tutta la richiesta, non solo gli header */

/* attributi per chart-interattivi.js: labels|values dal reale */
function chartAttrs(nome,kind,unit,hint,labels,values,cmpLabel,cmpValues){
  /* il vendor (handoff, intoccato) trasforma i vuoti in 0: un giorno senza
     dato diventerebbe uno zero INVENTATO nell'overlay. Quindi al contratto
     data-chart passano solo le coppie complete; i buchi restano visibili
     nei grafici inline della pagina, che i null li sanno gestire. */
  var L=[],V=[],C=cmpValues?[]:null;
  (values||[]).forEach(function(v,i){
    /* buco = null O stringa vuota: i renderer a barre passano '' per le sedi
       senza misura, e il vendor trasformerebbe anche quelle in zeri */
    if(v==null||v==='') return;
    if(cmpValues&&(cmpValues[i]==null||cmpValues[i]==='')) return;
    L.push(labels[i]); V.push(String(v).replace('.',','));
    if(C) C.push(String(cmpValues[i]).replace('.',','));
  });
  var a=' data-chart="'+esc(nome)+'" data-kind="'+kind+'" data-unit="'+esc(unit)+'" data-hint="'+esc(hint)+'"'+
    ' data-labels="'+esc(L.join('|'))+'" data-values="'+esc(V.join('|'))+'"';
  if(C) a+=' data-cmp-label="'+esc(cmpLabel)+'" data-cmp-values="'+esc(C.join('|'))+'"';
  return a;
}
function svgLine(values,w,h,stroke,sw){
  var v=values.filter(function(x){return x!=null;}); if(v.length<2) return '';
  var min=Math.min.apply(null,v),max=Math.max.apply(null,v); var pad=(max-min)*0.18||1;
  var lo=min-pad,hi=max+pad; var n=values.length;
  var pts=values.map(function(x,i){ if(x==null) return null;
    return ((i/(n-1))*w).toFixed(1)+','+((1-(x-lo)/(hi-lo))*h).toFixed(1);}).filter(Boolean).join(' ');
  return '<svg width="100%" height="'+h+'" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="display:block"><polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="'+(sw||2)+'"/></svg>';
}

/* design R9: UNICA definizione della qualifica di un intervallo stimato
   {min,max,tracce,nd_da}. Ogni scheda che mostra una stima passa da qui:
   niente copie della regola che possano divergere (kcal si', proteine no). */
function qualificaIntervallo(v,unita){
  if(!v||v.min==null) return {testo:'—',degradato:false,nd:0};
  var nd=Array.isArray(v.nd_da)?v.nd_da.length:0;
  var t=fmtInt(v.min)+'-'+fmtInt(v.max)+(unita?' '+unita:'');
  if(v.tracce) t+=' · tracce';
  if(nd) t+=' · parziale ('+nd+' ND)';
  return {testo:t,degradato:!!(nd||v.tracce),nd:nd};
}

var REGISTRO={};   /* REGISTRO[tab] = { tipo: renderFn } — riempito sotto */
function configUtente(tab){
  try{
    var raw=DATI.contesto&&DATI.contesto.dash_salute_v2;
    var c=raw?(typeof raw==='string'?JSON.parse(raw):raw):null;
    return (c&&c[tab]&&Array.isArray(c[tab]))?c[tab]:null;
  }catch(e){return null;}
}
function blocchiConfigurati(tab,def){
  try{
    var lista=configUtente(tab)||def;
    return lista.filter(function(b){return b.enabled!==false&&REGISTRO[tab][b.type];})
      .sort(function(a,b){return (a.order||0)-(b.order||0);});
  }catch(e){return def.filter(function(b){return REGISTRO[tab][b.type];});}
}
function montaBlocchi(tab,def){

     altrimenti il CSS annullerebbe il suo riordino (review-7, R7-1) */
  pane.classList.toggle('ordine-mockup',!configUtente(tab));

      var el=REGISTRO[tab][b.type](DATI,b);

function lineaVB(values,stroke,sw){
  var v=values.filter(function(x){return x!=null;}); if(v.length<2) return '';
  var min=Math.min.apply(null,v),max=Math.max.apply(null,v);var pad=(max-min)*0.18||1;
  var lo=min-pad,hi=max+pad,n=values.length;
  var pts=values.map(function(x,i){if(x==null)return null;
    return ((i/(n-1))*100).toFixed(2)+','+((1-(x-lo)/(hi-lo))*100).toFixed(2);}).filter(Boolean).join(' ');
  return '<polyline points="'+pts+'" fill="none" stroke="'+stroke+'" stroke-width="'+sw+'" vector-effect="non-scaling-stroke"/>';
}
function salvaMisure(btn){
  var out=document.getElementById('esitoMisura'); out.textContent='';
  var pane=btn.closest('.card'); var invii=[];
  var mappa={peso:'weight_kg',bf:'body_fat_pct',recovery:'whoop_recovery_pct',strain:'whoop_strain',sonno:'sleep_duration_hours'};
  pane.querySelectorAll('input[data-campo]').forEach(function(i){
    var v=i.value.trim().replace(',','.'); if(!v) return;
    var c=i.dataset.campo;
    /* contratti veri: /api/misura vuole {campo,valore}; /api/misura_corpo {misure:[{nome,valore}]} */
    if(c==='vita') invii.push(api('/api/misura_corpo',{misure:[{nome:'circ_vita',valore:Number(v)}]}));
    else invii.push(api('/api/misura',{campo:mappa[c],valore:Number(v)}));
  });
  var sede=document.getElementById('sedeMisura').value, sv=document.getElementById('sedeValore').value.trim().replace(',','.');
  if(sede&&sv) invii.push(api('/api/misura_corpo',{misure:[{nome:sede,valore:Number(sv)}]}));
  if(!invii.length){out.textContent='Niente da salvare: compila almeno un campo.';return;}
  Promise.allSettled(invii).then(function(ris){
    /* design R9 v2: l'UNICA fonte dell'esito e' il CORPO STRUTTURATO del
       server (salvate/confermate/incerte/rifiutate_dal_database/non_tentate),
       sommato tale e quale — cosi' il 409 parziale conta 1 salvata E 1
       rifiutata. Un 200 muto NON e' una conferma; un corpo illeggibile,
       la rete persa, il timeout e i 5xx restano INCERTI, fail-closed. */
    var salvate=0,rifiutate=0,incerte=0,nonTentate=0;
    /* l'evidenza si VALIDA, non si annusa (review-5): un corpo conta come
       esito solo se i tipi sono giusti, salvate e confermate concordano e
       la risposta COPRE almeno la misura chiesta. Tutto il resto e' incerto. */
    function nIntero(v){return typeof v==='number'&&isFinite(v)&&v>=0&&Math.floor(v)===v?v:null;}
    function haCampiEsito(c){return !!(c&&typeof c==='object'&&!Array.isArray(c)&&(c.salvate!==undefined||c.confermate!==undefined||c.incerte!==undefined||c.rifiutate_dal_database!==undefined||c.non_tentate!==undefined));}
    function classifica(c){
      if(!haCampiEsito(c)) return null;
      var s=null;
      if(c.salvate!==undefined){s=nIntero(c.salvate); if(s===null) return null;}
      if(Array.isArray(c.confermate)){ if(s!==null&&s!==c.confermate.length) return null; if(s===null)s=c.confermate.length; }
      else if(c.confermate!==undefined) return null;
      s=s||0;
      function arr(v){ if(v===undefined) return 0; if(!Array.isArray(v)) return null; return v.length; }
      var r=arr(c.rifiutate_dal_database), i=arr(c.incerte), nt=arr(c.non_tentate);
      if(r===null||i===null||nt===null) return null;
      if(s+r+i+nt<1) return null;         /* non copre la misura chiesta */
      return {s:s,r:r,i:i,nt:nt};
    }
    ris.forEach(function(r){
      var corpo=r.status==='fulfilled'?r.value:(r.reason||{}).corpo;
      var esito=classifica(corpo);
      if(esito){salvate+=esito.s;rifiutate+=esito.r;incerte+=esito.i;nonTentate+=esito.nt;return;}
      if(haCampiEsito(corpo)){incerte++;return;}  /* esito nominale ma invalido/scoperto */
      if(r.status==='fulfilled'){incerte++;return;}  /* 200 senza attestazione */
      var e=r.reason||{};
      /* respinta DICHIARATA: 4xx con un corpo-oggetto che porta un errore testuale */
      if(e.stato>=400&&e.stato<500&&corpo&&typeof corpo==='object'&&!Array.isArray(corpo)&&
         typeof corpo.errore==='string'&&corpo.errore.trim()!==''){rifiutate++;return;}
      incerte++;
    });
    out.textContent=salvate+' salvat'+(salvate===1?'a':'e')+
      (rifiutate?' · '+rifiutate+' RIFIUTATE (guardia del registro)':'')+
      (nonTentate?' · '+nonTentate+' non tentate (fermate dopo il primo problema)':'')+
      (incerte?' · '+incerte+' SENZA CONFERMA: potrebbero essere scritte, verifica prima di ripetere':'');
    caricaTutto().then(function(){RENDER.corpo();});
  });
}

/* identita' dell'operazione: un doppio tocco non fa due scritture (contratto validaSpesa) */
function nuovaChiave(){
  if(window.crypto&&crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0,v=c==='x'?r:(r&0x3|0x8);return v.toString(16);});
}
/* design R9 v2 applicato ANCHE alla spesa (review-10): l'esito viene dal
   CORPO del dominio, mai dall'HTTP 200. scritto:false = NON scritto. */
function spesaScritta(r){
  /* N11-1: i tipi si validano, non si coercono — scritto:"false" e scritto:0
     non sono un si', un esito-array non e' un esito */
  if(!r||typeof r!=='object'||Array.isArray(r)) return false;
  if(r.scritto!==undefined&&r.scritto!==true) return false;
  return typeof r.esito==='string'&&/^(aggiornato|creato|chiuso)$/.test(r.esito);
}
function motivoSpesa(r){
  var e=String((r&&r.esito)||'esito assente');
  if(e==='versione_superata') return 'la lista è cambiata nel frattempo: ricarico';
  if(e==='invariato') return 'già in lista';
  if(e==='piano_assente') return 'manca il piano da cui far nascere la lista';
  return e;
}
function cambiaStatoRiga(id,rev,nuovo){
  if(id==null){alert('questa voce non porta un id: si gestisce da Ada');return Promise.reject(new Error('senza id'));}
  var giro=DATI.spesa&&DATI.spesa.giro;
  if(!giro||giro.id==null){alert('nessun giro aperto: crealo dal catalogo master o con Ada');return Promise.reject(new Error('senza giro'));}
  return api('/api/lista_spesa/giro',{azione:'stato',giro:giro.id,alimento:id,rev:rev,stato:nuovo,operazione:nuovaChiave()})
    .then(function(r){
      if(!spesaScritta(r)){var err=new Error(motivoSpesa(r));err.esitoDominio=String((r&&r.esito)||'');throw err;}
      return r;
    });
}

   il badge a destra = ce l'ho gia' in casa si'/no. Niente ciclo a tre stati. */

   in sequenza, con esito CONTATO dal CORPO (ok/rifiutate col motivo) */
function azzeraLista(btn){
  var righe=((DATI.spesa||{}).righe||[]).filter(function(r){return statoRiga(r)!=='da_comprare';});
  var out=document.getElementById('esitoGiro');

  if(!confirm('Riporto '+righe.length+' voci a «da comprare»?')) return;

/* ═══════════ ABBINAMENTI — giudicati dal motore, non accostati a caso ══
   Ogni terna qui dentro e' passata da engine/motore.mjs punteggia() e da
   verificaCanone() con il contesto vero (kb/08): registro, formalita',
   volume, tessuto, canone. Quelle che non passano NON ci sono, e
   un'occasione senza proposte resta vuota con il suo perche': per la
   giornata col cliente il motore ha scartato 40.000 terne su 40.000,
   perche' nel catalogo non c'e' niente di abbastanza formale. */
var OCC_ATTIVA='';
/* UNA RISPOSTA VECCHIA NON SCRIVE SU UN PANNELLO NUOVO.
   Trovato il 06/10 cliccando l'app come utente: entrando in Outfit il
   pannello si disegna due volte (una dal cambio sezione, una dal cambio tab)
   e la risposta della PRIMA chiamata si attaccava al pannello gia' ridisegnato:
   65 card dove dovevano essere 33. E' la stessa famiglia della guardia R12-3
   che l'app aveva gia' sulla conversazione di Ada. */
var GEN_OUTFIT=0;
function montaAbbinamenti(){
  var p=document.querySelector('.pane[data-pane="abbinamenti"]');
  if(!p) return;
  p.textContent='';
  var testa=document.createElement('div'); testa.className='card'; testa.style.gridColumn='1 / -1';
  var h=document.createElement('div'); h.className='testa';
  var t1=document.createElement('span'); t1.className='tit'; t1.textContent='Abbinamenti giudicati';
  var t2=document.createElement('span'); t2.className='etk'; t2.textContent='MOTORE kb/01 + kb/11';

  testa.appendChild(filtri);
  var nota=document.createElement('div'); nota.className='nota'; nota.textContent='Caricamento…';
  testa.appendChild(nota); p.appendChild(testa);

  var mia=++GEN_OUTFIT;
  api('/api/abbinamenti'+(OCC_ATTIVA?('?occasione='+encodeURIComponent(OCC_ATTIVA)):'')).then(function(d){
    if(mia!==GEN_OUTFIT) return;   /* un'altra richiesta e' partita dopo: questa non scrive */
    var occ=(d&&d.occasioni)||[];
    ['tutte'].concat(occ).forEach(function(o){
      var b=document.createElement('button'); b.className='tab'+(((o==='tutte')===(!OCC_ATTIVA))&&(o==='tutte'||o===OCC_ATTIVA)?' on':'');
      b.textContent=o.replace(/_/g,' ');
      b.onclick=function(){ OCC_ATTIVA = (o==='tutte')?'':o; montaAbbinamenti(); };
      filtri.appendChild(b);
    });
    var ab=(d&&d.abbinamenti)||[];
    if(!ab.length){
      nota.textContent='nessun abbinamento per questa occasione: il motore non ha trovato niente che passi le regole, e non invento';
      return;
    }
    /* Un'occasione con meno di tre proposte lo DICE. Il motore ha scartato
       quello che non passava, e l'app non deve far contare le card a Diego
       per accorgersene: per la giornata col cliente, su 40.000 terne provate
       ne passano due, perche' nel catalogo non c'e' quasi niente di
       abbastanza formale. Si dichiara, non si riempie. */
    var perOcc={};
    ab.forEach(function(x){ perOcc[x.occasione]=(perOcc[x.occasione]||0)+1; });
    var scarse=Object.keys(perOcc).filter(function(k){ return perOcc[k]<3; });
    nota.textContent=ab.length+' abbinamenti, ognuno con il voto del motore e il perche'
      + (scarse.length ? ('. Sotto le tre proposte: '
          + scarse.map(function(k){ return k.replace(/_/g,' ')+' ('+perOcc[k]+')'; }).join(', ')
          + ' — il motore ha scartato il resto, e non riempio') : '');
    ab.forEach(function(a){
      var c=document.createElement('div'); c.className='card'; c.style.gridColumn='span 4';
      var hh=document.createElement('div'); hh.className='testa';
      var n1=document.createElement('span'); n1.className='tit';

      var n2=document.createElement('span'); n2.className='etk'; n2.textContent=a.totale_eur+' EUR';
      hh.appendChild(n1); hh.appendChild(n2); c.appendChild(hh);
      var perche=document.createElement('div'); perche.className='nota';
      perche.textContent=(a.perche||'')+' · formalita '+a.formalita+' · '+a.registro+
        (a.canone&&a.canone!=='conforme'?(' · canone '+a.canone):'');
      c.appendChild(perche);
      (a.capi||[]).forEach(function(capo){
        var riga=document.createElement('a');
        riga.href=capo.link||'#'; riga.target='_blank'; riga.rel='noopener noreferrer';
        riga.style.cssText='display:flex;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--riga);text-decoration:none';
        var img=document.createElement('img');
        img.width=44; img.height=58; img.loading='lazy'; img.referrerPolicy='no-referrer';
        img.style.cssText='width:44px;height:58px;object-fit:cover;border-radius:var(--r-chip-s);background:var(--vetro);flex:none';
        if(capo.immagine && /^https:\/\//.test(capo.immagine)) img.src=capo.immagine;
        riga.appendChild(img);
        var box=document.createElement('div'); box.style.cssText='min-width:0;flex:1';
        var r1=document.createElement('div');
        r1.style.cssText='color:var(--testo1);font:500 12.5px var(--font-ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        r1.textContent=capo.titolo||'(senza titolo)';
        var r2=document.createElement('div');
        r2.style.cssText='color:var(--testo3);font:400 11px var(--font-ui)';
        var tg=(capo.taglie||[]).filter(function(x){return x;});
        r2.textContent=capo.ruolo+' · '+(capo.sottocategoria||'?')+(capo.registro?(' · '+capo.registro):'')+' · '+capo.prezzo+' EUR'
          +(tg.length?(' · taglie '+tg.slice(0,8).join(' ')):' · taglie non dichiarate');
        box.appendChild(r1); box.appendChild(r2); riga.appendChild(box);
        c.appendChild(riga);
      });
      /* Il giudizio: due bottoni, e quello che scrivi resta. Non cambia il
         voto del motore — un "non mi piace" e' un dato, non una regola. */
      var voto=document.createElement('div');
      voto.style.cssText='display:flex;gap:8px;align-items:center;padding-top:9px;border-top:1px solid var(--riga);margin-top:6px';
      var esito=document.createElement('span');
      esito.style.cssText='color:var(--testo4);font:400 11px var(--font-ui);margin-left:auto';
      esito.textContent=(a.mi_piace||a.non_mi_piace)?('giudizi: '+(a.mi_piace||0)+' su, '+(a.non_mi_piace||0)+' giu'):'non ancora giudicato';
      [['mi piace',true],['non mi piace',false]].forEach(function(par){
        var b=document.createElement('button');
        b.type='button'; b.className='tab';
        b.textContent=par[0];
        b.onclick=function(){
          b.disabled=true; esito.textContent='…';
          api('/api/giudizio',{outfit:a.id,mi_piace:par[1]}).then(function(r){
            esito.textContent = (r&&r.ok)
              ? ('segnato · giudizi su questo: '+(r.giudizi_su_questo||1))
              : ('non segnato: '+((r&&r.errore)||'errore'));
          }).catch(function(e){
            esito.textContent='non segnato: '+(e&&e.message?e.message:'errore');
          }).finally(function(){ b.disabled=false; });
        };
        voto.appendChild(b);
      });
      voto.appendChild(esito);
      c.appendChild(voto);
      p.appendChild(c);
    });
  }).catch(function(e){
    if(mia!==GEN_OUTFIT) return;
    nota.textContent='gli abbinamenti non rispondono: '+(e&&e.message?e.message:'errore');
  });
}

/* ═══ CARICAMENTO DATI — ogni fonte che tace resta dichiarata, mai zero ═══ */
function tenta(p){return p.catch(function(e){return {__errore:e.message};});}
function ok(x){return x&&!x.__errore?x:null;}
/* una fonte in ERRORE non è una fonte VUOTA: l'elenco resta dichiarato in testata */
var FONTI_MUTE=[];
function caricaSpesa(){
  return Promise.all([tenta(api('/api/lista_spesa?cosa=tutto')),tenta(api('/api/lista_spesa?cosa=variabile')),tenta(api('/api/lista_spesa?cosa=giri'))])
    .then(function(r){
      /* contratto salute_spesa_leggi: giro e' un OGGETTO {id,rev,titolo,stato,righe:[...]} */
      var tutto=ok(r[0])||{};
      var giro=tutto.giro||null;
      DATI.spesa={giro:giro,righe:(giro&&giro.righe)||[],master:tutto.master||[],
        integratori:tutto.integratori||[],storico:(ok(r[2])||{}).giri||[]};
      DATI.spesaVariabile=(ok(r[1])||{}).variabile||[];
      /* OGNI lettura fallita resta un errore con nome, mai un vuoto */
      DATI.spesaErrore=r[0]&&r[0].__errore?r[0].__errore:null;
      DATI.spesaVariabileErrore=r[1]&&r[1].__errore?r[1].__errore:null;
      DATI.spesaGiriErrore=r[2]&&r[2].__errore?r[2].__errore:null;
    });
}
function caricaBrain(){
  /* salute_terapia_lista risponde con un ARRAY di appunti, uno stato per chiamata */
  return Promise.all([tenta(api('/api/psicologa?stato=corrente')),tenta(api('/api/psicologa?stato=storico'))])
    .then(function(r){
      var c=ok(r[0]), s=ok(r[1]);
      DATI.psicologa={correnti:Array.isArray(c)?c:[],storico:Array.isArray(s)?s:[]};
      DATI.brainErrore=(r[0]&&r[0].__errore)||(r[1]&&r[1].__errore)||null;
    });
}
function caricaTutto(){
  var oggi=new Date(); var iso=function(d){return d.toLocaleDateString('sv-SE');};
  var a7da=new Date(oggi);a7da.setDate(a7da.getDate()-6);
  var a28da=new Date(oggi);a28da.setDate(a28da.getDate()-27);
  return Promise.all([
    tenta(api('/api/contesto')),                 /*0*/
    tenta(api('/api/dati?giorni=180')),          /*1*/
    tenta(api('/api/semaforo')),                 /*2*/
    tenta(api('/api/tdee')),                     /*3*/
    tenta(api('/api/qualita')),                  /*4*/
    tenta(api('/api/aderenza?da='+iso(a7da)+'&a='+iso(oggi))),   /*5*/
    tenta(api('/api/aderenza?da='+iso(a28da)+'&a='+iso(oggi))),  /*6*/
    tenta(api('/api/box')),                      /*7*/
    tenta(api('/api/abitudini')),                /*8*/
    tenta(api('/api/pliche')),                   /*9*/
    tenta(api('/api/misure_trend')),             /*10*/
    tenta(api('/api/nutrizione')),               /*11*/
    tenta(api('/api/chat_storia')),              /*12*/
    tenta(api('/api/obiettivi')),                /*13*/
    tenta(api('/api/check_stats')),              /*14*/
    tenta(api('/api/ricette')),                  /*15*/
    caricaSpesa(), caricaBrain()
  ]).then(function(r){
    DATI.contesto=ok(r[0])||{};
    DATI.dati182=Array.isArray(ok(r[1]))?ok(r[1]):((ok(r[1])||{}).giorni||[]);
    /* REV GRAFICA 14/09: tutte le card assumono la serie in ordine
       CRESCENTE di data (ult = ultimo elemento). L'API la mandava al
       contrario e ogni "ultimo" era il piu' VECCHIO: le card mostravano
       «18 mar · 124,5 kg» al posto di oggi. Si ordina QUI, una volta. */
    DATI.dati182.sort(function(a,b){return String(a.date||'').localeCompare(String(b.date||''));});
    DATI.semaforo=ok(r[2])||{}; DATI.tdee=ok(r[3])||{}; DATI.qualita=ok(r[4])||{};
    DATI.aderenza7=ok(r[5])||{}; DATI.aderenza28=ok(r[6])||{};
    DATI.box=ok(r[7])||{}; DATI.abitudini=normalizzaAbitudini(ok(r[8]));
    DATI.pliche=ok(r[9])||[];
    DATI.misureTrend=ok(r[10])||{};
    DATI.nutrizione=ok(r[11])||{};
    DATI.chatStoria=Array.isArray(ok(r[12]))?ok(r[12]):((ok(r[12])||{}).messaggi||[]);
    DATI.obiettivi=ok(r[13])||null; DATI.checkStats=ok(r[14])||null;
    DATI.ricette=(ok(r[15])||{}).ricette||[];
    DATI.statoObiettivi=DATI.obiettivi&&DATI.obiettivi.stato?DATI.obiettivi.stato:null;
    var nomi=['contesto','dati','semaforo','tdee','qualità','aderenza 7gg','aderenza 28gg','box','abitudini','pliche','misure','nutrizione','chat','obiettivi','check','ricette'];
    FONTI_MUTE=nomi.filter(function(n,i){return r[i]&&r[i].__errore;});
    if(DATI.spesaErrore) FONTI_MUTE.push('spesa');
    if(DATI.spesaVariabileErrore) FONTI_MUTE.push('spesa variabile');
    if(DATI.spesaGiriErrore) FONTI_MUTE.push('storico giri');
    if(DATI.brainErrore) FONTI_MUTE.push('brain');
    aggiornaContesto();
    /* la stima della giornata e' REALE solo per lettere scelte: si chiede col
       default mostrato (la prima alternativa di ogni pasto), mai inventata */
    return caricaStima();
  });
}
function normalizzaAbitudini(a){
  if(!a) return [];
  var lista=Array.isArray(a)?a:(a.abitudini||[]);
  return lista.map(function(x){return{nome:x.nome||x.codice,ultimi_7:x.ultimi_7||x.settimana_giorni||[],
    fatta_oggi:x.fatta_oggi,riposo_oggi:x.riposo_oggi,saltata_oggi:x.saltata_oggi};});
}
function caricaStima(){
  var piano=(DATI.nutrizione||{}).piano||{}; var alt=piano.alternative||[];
  DATI.stima=null;
  if(!alt.length) return Promise.resolve();
  var prima={};
  alt.forEach(function(a){if(a.pasto&&!prima[a.pasto])prima[a.pasto]=a.lettera;});
  var qs=Object.keys(prima).map(function(p){return p+'='+encodeURIComponent(prima[p]);}).join('&');
  return tenta(api('/api/nutrizione/stima?'+qs)).then(function(s){
    s=ok(s);
    if(s&&s.esito==='letto'){DATI.stima=s;DATI.stimaScelte=prima;}
    else if(s===null){FONTI_MUTE.push('stima');aggiornaContesto();}
  });
}
function aggiornaContesto(){
  var d=new Date();
  var giorni=['dom','lun','mar','mer','gio','ven','sab'];
  var t=giorni[d.getDay()]+' '+d.getDate()+' '+['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(FONTI_MUTE.length)
    document.getElementById('contestoTesto').innerHTML=esc(t)+' · <span style="color:var(--attenzione)">dati parziali: '+esc(FONTI_MUTE.join(', '))+'</span>';
  else document.getElementById('contestoTesto').textContent=t;
  var md=giorni[d.getDay()]+' '+d.getDate()+' '+['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'][d.getMonth()];
  if(FONTI_MUTE.length)
    document.getElementById('mobData').innerHTML=esc(md)+' · <span style="color:var(--attenzione)">dati parziali</span>';
  else document.getElementById('mobData').textContent=md;
}

function inviaFile(file,tipo){
  if(!file) return;
  /* lo stesso lock della chat: un upload puo' produrre REGISTRAZIONI, quindi
     un secondo invio durante l'attesa non deve partire */
  if(ALFRED_OCCUPATO){mostraRisposta('Sto ancora lavorando alla richiesta precedente: riprova tra un momento.',[]);return;}
  if(file.size>4*1024*1024){mostraRisposta('File troppo grande (max 4 MB da qui): passalo su Telegram.',[]);return;}
  ALFRED_OCCUPATO=true;
  var r=new FileReader();
  r.onerror=function(){ALFRED_OCCUPATO=false;mostraRisposta('Non sono riuscito a leggere il file dal dispositivo.',[]);};
  r.onload=function(){
    var b64=String(r.result).split(',')[1];
    document.getElementById('appfusto').classList.add('ascolta');
    mostraRisposta('Leggo '+file.name+'…',[]);
    api('/api/chat_file',{nome:file.name,tipo:file.type||tipo,contenuto:b64,
      domanda:tipo==='image'?'Foto caricata dall\'app. Se è un pasto: riconosci gli alimenti, stima le porzioni, calcola e registra.':'File caricato dall\'app: leggilo, estrai fedelmente il contenuto e salvalo dove va.'})
      .then(function(x){mostraRisposta(x.risposta||'(vuoto)',seguitiPer(TAB_ATTIVA));return caricaTutto();})
      .then(function(){RENDER[TAB_ATTIVA]&&RENDER[TAB_ATTIVA]();})
      .catch(function(e){mostraRisposta(e&&e.scaduto?'Nessuna conferma entro 2 minuti: il file potrebbe essere arrivato comunque. Controlla prima di rimandarlo.':'Non sono riuscito a mandarlo: '+e.message,[]);})
      .finally(function(){ALFRED_OCCUPATO=false;});
  };
  r.readAsDataURL(file);
}

/* ═══ RIORDINO WIDGET — tieni premuto una scheda e trascinala, come le app
   del telefono. Su mobile cambia l'ordine della colonna; su desktop le due
   schede si SCAMBIANO la cella. L'ordine si salva in contesto (dash_salute_v2)
   e si RILEGGE: senza conferma del server non si dichiara salvato. ═══ */
var RIORDINO={timer:null,presa:null,attivo:false,partenza:null};
function riordinoAvvia(card){
  var pane=card.parentElement; RIORDINO.attivo=true; RIORDINO.presa=card;
  /* da qui comanda l'ordine del DOM, non quello del mockup: quello che vedi
     trascinando è quello che verrà salvato. Prima di togliere il mockup si
     allinea il DOM all'ordine VISIVO, così niente salti a inizio drag. */
  if(pane.classList.contains('ordine-mockup')&&window.innerWidth<=760&&window.getComputedStyle){
    var figli=[].slice.call(pane.children);
    figli.sort(function(a,b){return (parseInt(window.getComputedStyle(a).order,10)||0)-(parseInt(window.getComputedStyle(b).order,10)||0);});
    figli.forEach(function(f){pane.appendChild(f);});
  }
  pane.classList.remove('ordine-mockup');
  pane.classList.add('riordino'); card.classList.add('presa');
  avvisoRiordino('Trascina per spostare · tocca fuori per finire');
}
function avvisoRiordino(t){var a=document.getElementById('riordinoAvviso');a.textContent=t;a.classList.add('si');
  clearTimeout(a._t);a._t=setTimeout(function(){a.classList.remove('si');},2600);}
function riordinoFine(salva){
  var pane=document.querySelector('.pane.riordino'); if(!pane) return;
  if(RIORDINO.presa) RIORDINO.presa.classList.remove('presa');
  pane.querySelectorAll('.bersaglio').forEach(function(x){x.classList.remove('bersaglio');});
  pane.classList.remove('riordino');
  var daSalvare=RIORDINO.attivo&&salva; RIORDINO.attivo=false; RIORDINO.presa=null;
  if(!daSalvare) return;
  var tab=pane.getAttribute('data-pane');
  var blocchi=[].slice.call(pane.querySelectorAll(':scope>[data-blocco]')).map(function(el,i){
    return {type:el.getAttribute('data-blocco'),order:i+1,
      col:el.style.gridColumn||undefined,row:el.style.gridRow||undefined};});
  api('/api/dash',{tab:tab,blocchi:blocchi}).then(function(r){
    if(!r||r.esito!=='salvato'){avvisoRiordino('Ordine NON salvato: '+((r&&r.esito)||'senza conferma'));return;}
    avvisoRiordino('Ordine salvato ✓');
    if(DATI.contesto) DATI.contesto.dash_salute_v2=r.dash||DATI.contesto.dash_salute_v2;
  }).catch(function(e){
    avvisoRiordino('Ordine non salvato: '+e.message);
    RENDER[tab]&&RENDER[tab]();   /* si torna all'ordine vero, non a quello finto */
  });
}
document.addEventListener('pointerdown',function(e){
  var card=e.target&&e.target.closest?e.target.closest('.pane.on>[data-blocco]'):null;
  if(RIORDINO.attivo){
    if(!card){riordinoFine(true);return;}
    /* seconda pressione in modalita' riordino: prendi questa scheda */
    RIORDINO.presa&&RIORDINO.presa.classList.remove('presa');
    RIORDINO.presa=card; card.classList.add('presa');
    return;
  }
  if(!card) return;
  if(e.target.closest('button,input,select,textarea,a,.chip,.spunta,.cliccabile,[data-chart-expand],[onclick]')) return;
  RIORDINO.partenza={x:e.clientX,y:e.clientY};
  clearTimeout(RIORDINO.timer);
  RIORDINO.timer=setTimeout(function(){riordinoAvvia(card);},550);
});
document.addEventListener('pointermove',function(e){
  if(RIORDINO.timer&&RIORDINO.partenza){
    if(Math.abs(e.clientX-RIORDINO.partenza.x)+Math.abs(e.clientY-RIORDINO.partenza.y)>12){clearTimeout(RIORDINO.timer);RIORDINO.timer=null;}
  }
  if(!RIORDINO.attivo||!RIORDINO.presa) return;
  e.preventDefault();
  var sotto=document.elementFromPoint(e.clientX,e.clientY);
  var altra=sotto&&sotto.closest?sotto.closest('.pane.on>[data-blocco]'):null;
  var pane=RIORDINO.presa.parentElement;
  pane.querySelectorAll('.bersaglio').forEach(function(x){x.classList.remove('bersaglio');});
  if(!altra||altra===RIORDINO.presa) return;
  altra.classList.add('bersaglio');
});
document.addEventListener('pointerup',function(e){
  clearTimeout(RIORDINO.timer);RIORDINO.timer=null;
  if(!RIORDINO.attivo||!RIORDINO.presa) return;
  var sotto=document.elementFromPoint(e.clientX,e.clientY);
  var altra=sotto&&sotto.closest?sotto.closest('.pane.on>[data-blocco]'):null;
  if(altra&&altra!==RIORDINO.presa){
    var io=RIORDINO.presa;
    if(window.innerWidth<=760){
      /* colonna mobile: inserisci prima o dopo secondo la posizione */
      var r=altra.getBoundingClientRect();
      if(e.clientY<r.top+r.height/2) altra.parentElement.insertBefore(io,altra);
      else altra.parentElement.insertBefore(io,altra.nextSibling);
    }else{
      /* griglia desktop: le due schede si scambiano la cella */
      var c=io.style.gridColumn,rg=io.style.gridRow;
      io.style.gridColumn=altra.style.gridColumn;io.style.gridRow=altra.style.gridRow;
      altra.style.gridColumn=c;altra.style.gridRow=rg;
      var seg=document.createComment('x');io.parentElement.insertBefore(seg,io);
      altra.parentElement.insertBefore(io,altra);seg.parentElement.insertBefore(altra,seg);seg.remove();
    }
    altra.classList.remove('bersaglio');
  }
});

/* ═══ VISTA ALFRED — conversazioni, pin e cartelle (modello di Diego 13/09):
   TELEGRAM e' UNA chat continua; le chat aperte dal sito sono SEPARATE
   (chiave app:c<id>); la memoria del coach e' totalmente condivisa. ═══ */
var VISTA_ALFRED=false, CONV_CHAT=null, ORG_CHAT=null, SEQ_CONV=0;
function oggiISO(){return new Date().toLocaleDateString('sv-SE');}
function nuovaConversazione(){return 'app:c'+Math.random().toString(36).slice(2,10);}

/* Il comando Salute riporta a casa da DUE posti: dalla vista di Ada e dalla
   sezione Outfit. Lo fa qui dentro, cosi' chi lo chiama resta una riga sola. */
function tornaSalute(){
  if(AMBITO!=='salute'){vaiAmbito('salute');return;}
  if(VISTA_ALFRED)vai('oggi');
}
function caricaArchivioChat(){
  api('/api/chat_archivio?giorni=365').then(function(r){
    DATI.chatArchivio=(r&&r.conversazioni)||[];
    /* org ASSENTE o GUASTA = null = SOLA LETTURA: mai una vuota sovrascrivibile */
    var o=r&&r.org;
    var forma=o&&Array.isArray(o.pin)&&o.cartelle&&typeof o.cartelle==='object'&&!Array.isArray(o.cartelle)&&
      Object.keys(o.cartelle).every(function(n){return Array.isArray(o.cartelle[n]);});
    ORG_CHAT=forma?o:null;
    if(r&&r.nota_org) avvisoRiordino(r.nota_org);
    renderListaChat();
    if(!CONV_CHAT){var prima=(DATI.chatArchivio[0]&&DATI.chatArchivio[0].chiave)||'telegram';CONV_CHAT=prima;}
    caricaConversazione(CONV_CHAT);
  }).catch(function(e){
    ORG_CHAT=null;
    document.getElementById('alfListe').innerHTML=muto('archivio non leggibile ora: '+e.message);
    document.getElementById('alfMsg').innerHTML='';
  });
}
function nomeConversazione(c){
  if(c.chiave==='telegram') return 'Telegram · chat continua';
  if(c.chiave==='app') return 'Sito · storico';
  return (c.apertura||'').trim()||'(conversazione nuova)';
}
function pinnata(chiave){return !!(ORG_CHAT&&ORG_CHAT.pin.indexOf(chiave)>=0);}
function cartellaDi(chiave){
  if(!ORG_CHAT) return null;
  var nomi=Object.keys(ORG_CHAT.cartelle);
  for(var i=0;i<nomi.length;i++){if((ORG_CHAT.cartelle[nomi[i]]||[]).indexOf(chiave)>=0)return nomi[i];}
  return null;
}
function etichettaChat(c){
  var azioni=ORG_CHAT?'<span class="azioni"><b onclick="event.stopPropagation();togglePin(\''+c.chiave+'\')">'+(pinnata(c.chiave)?'togli pin':'pinna')+'</b>'+
    '<b onclick="event.stopPropagation();mettiInCartella(\''+c.chiave+'\')">cartella</b></span>':'';
  return '<span class="tit">'+esc(nomeConversazione(c))+'</span><span class="sotto"><span>'+esc(dataIT(String(c.fine||'').slice(0,10)))+'</span><span>'+c.messaggi+' msg</span>'+
    (pinnata(c.chiave)?'<span style="color:var(--accento)">pinnata</span>':'')+'</span>'+azioni;
}
function renderListaChat(){
  var out=document.getElementById('alfListe'); var conv=DATI.chatArchivio||[];
  function riga(c){return '<div class="alfChat'+(c.chiave===CONV_CHAT?' on':'')+'" onclick="CONV_CHAT=\''+c.chiave+'\';caricaConversazione(CONV_CHAT);renderListaChat()">'+etichettaChat(c)+'</div>';}
  var perChiave=Object.create(null); conv.forEach(function(c){perChiave[c.chiave]=c;});
  var h='';
  if(!ORG_CHAT) h+='<div class="nota" style="color:var(--attenzione)">organizzazione non leggibile: pin e cartelle in SOLA LETTURA finché non torna</div>';
  if(ORG_CHAT){
    var pinnate=ORG_CHAT.pin.map(function(k){return perChiave[k];}).filter(Boolean);
    if(pinnate.length){h+='<div class="sez">PINNATE</div>'+pinnate.map(riga).join('');}
    Object.keys(ORG_CHAT.cartelle).sort().forEach(function(nome){
      var dentro=(ORG_CHAT.cartelle[nome]||[]).map(function(k){return perChiave[k];}).filter(Boolean);
      h+='<div class="sez">'+esc(nome.toUpperCase())+' ('+dentro.length+')</div>'+dentro.map(riga).join('');
    });
  }
  var libere=conv.filter(function(c){return !pinnata(c.chiave)&&!cartellaDi(c.chiave);});
  h+='<div class="sez">CONVERSAZIONI</div>'+(libere.length?libere.map(riga).join(''):muto('parla con Ada e lo storico si riempie'));
  h+='<div class="nota" style="margin-top:6px">La memoria di Ada è UNICA: ogni chat vede tutto.</div>';
  out.innerHTML=h;
}
function salvaOrgChat(){
  if(!ORG_CHAT){avvisoRiordino('Organizzazione non leggibile: niente modifiche finché non torna.');return Promise.resolve();}
  return api('/api/chat_org',{pin:ORG_CHAT.pin,cartelle:ORG_CHAT.cartelle}).then(function(r){
    if(!r||r.esito!=='salvato'){avvisoRiordino('Organizzazione NON salvata: '+((r&&r.esito)||'senza conferma'));}
    else avvisoRiordino('Salvato ✓');
  }).catch(function(e){avvisoRiordino('Organizzazione non salvata: '+e.message);});
}
function togglePin(chiave){
  if(!ORG_CHAT){avvisoRiordino('Organizzazione non leggibile: niente modifiche finché non torna.');return;}
  var i=ORG_CHAT.pin.indexOf(chiave);
  if(i>=0)ORG_CHAT.pin.splice(i,1);else ORG_CHAT.pin.unshift(chiave);
  renderListaChat(); salvaOrgChat();
}
function mettiInCartella(chiave){
  if(!ORG_CHAT){avvisoRiordino('Organizzazione non leggibile: niente modifiche finché non torna.');return;}
  var attuale=cartellaDi(chiave);
  var nome=prompt('Cartella per questa conversazione (vuoto = nessuna).'+(attuale?' Ora: '+attuale:''),attuale||'');
  if(nome===null)return;
  nome=nome.trim();
  if(nome&&(nome==='__proto__'||nome==='constructor'||nome==='prototype'||Object.prototype.hasOwnProperty.call(Object.prototype,nome))){
    avvisoRiordino('Nome cartella riservato («'+nome+'»): scegline un altro.');
    return;   /* PRIMA di toccare le assegnazioni: niente perdite (R15-3) */
  }
  Object.keys(ORG_CHAT.cartelle).forEach(function(n){
    ORG_CHAT.cartelle[n]=(ORG_CHAT.cartelle[n]||[]).filter(function(k){return k!==chiave;});
    if(!ORG_CHAT.cartelle[n].length)delete ORG_CHAT.cartelle[n];
  });
  if(nome){
    /* accesso SICURO: 'constructor' e simili non sono le nostre cartelle (R12-4) */
    var attuali=Object.prototype.hasOwnProperty.call(ORG_CHAT.cartelle,nome)?ORG_CHAT.cartelle[nome]:[];
    ORG_CHAT.cartelle[nome]=attuali.concat([chiave]);
  }
  renderListaChat(); salvaOrgChat();
}
function oraIT(ts){
  try{return new Date(ts).toLocaleTimeString('it-IT',{timeZone:'Europe/Rome',hour:'2-digit',minute:'2-digit'});}
  catch(e){return String(ts||'').slice(11,16);}
}
function caricaConversazione(chiave){
  var mia=++SEQ_CONV;                     /* la risposta VECCHIA non vince (R12-3) */
  var out=document.getElementById('alfMsg');
  var nuova=!((DATI.chatArchivio||[]).some(function(c){return c.chiave===chiave;}));
  document.getElementById('alfTitolo').innerHTML='<span style="color:var(--testo1);font:500 14px var(--font-ui)">'+
    esc(chiave==='telegram'?'Telegram · chat continua':(chiave==='app'?'Sito · storico':'Chat del sito'))+'</span>'+
    '<span style="color:var(--testo4);font:400 10.5px var(--font-mono)">'+(nuova?'nuova conversazione: scrivi qui sotto':'scrivi qui sotto per continuare')+'</span>';
  if(nuova){out.innerHTML=muto('conversazione nuova: il primo messaggio la fa nascere');return;}
  out.innerHTML='<div class="nota">carico…</div>';
  api('/api/chat_conversazione?chiave='+encodeURIComponent(chiave)).then(function(msgs){
    if(mia!==SEQ_CONV) return;
    if(!Array.isArray(msgs)||!msgs.length){out.innerHTML=muto('nessun messaggio qui');return;}
    out.innerHTML=msgs.map(function(m){
      return '<div class="'+(m.ruolo==='diego'?'msg-io':'msg-coach')+'">'+esc(String(m.testo||'').replace(/^\[[a-z_]+\]\s*/i,''))+
        '<div style="color:'+(m.ruolo==='diego'?'rgba(var(--inchiostro-rgb),.55)':'var(--testo4)')+';font:400 9px var(--font-mono);margin-top:3px">'+esc(dataIT(String(m.ts||'').slice(0,10)))+' '+esc(oraIT(m.ts))+' · '+esc(m.canale||'')+'</div></div>';
    }).join('');
    out.scrollTop=out.scrollHeight;
  }).catch(function(e){if(mia===SEQ_CONV)out.innerHTML=muto('conversazione non leggibile: '+e.message);});
}

<!-- FASE 2 — scelta della pelle. Temporaneo: sparisce quando Diego ha scelto. -->
<div id="pelli" hidden>
  <span class="eti">pelle</span>
  <button type="button" data-p="attuale" aria-pressed="false">Attuale</button>
  <button type="button" data-p="inchiostro" aria-pressed="false">Inchiostro</button>
  <button type="button" data-p="bronzo" aria-pressed="false">Bronzo</button>
  <button type="button" data-p="carta" aria-pressed="false">Carta</button>
</div>
<script>
/* Il selettore non deve MAI far morire il boot della pagina: gira dentro un
   try/catch e si disarma se il DOM non ha i pezzi che gli servono. Il banco
   frontend esegue tutti gli script della pagina con un DOM minimo, e uno
   script che muore al boot porta giu' tutta la pagina (lezione della v1). */
(function(){
  try{
    var TINTA={attuale:'#050505',inchiostro:'#080B11',bronzo:'#100F0E',carta:'#F5F4F1'};
    var box=document.getElementById && document.getElementById('pelli');
    var radice=document.documentElement;
    if(!box || !radice || !radice.setAttribute || !box.querySelectorAll) return;
    var bottoni=box.querySelectorAll('button[data-p]');
    if(!bottoni || !bottoni.length) return;

    function applica(p,salva){
      if(!TINTA[p]) p='attuale';
      if(p==='attuale') radice.removeAttribute('data-pelle');
      else radice.setAttribute('data-pelle',p);
      var meta=document.querySelector && document.querySelector('meta[name=\"theme-color\"]');
      if(meta && meta.setAttribute) meta.setAttribute('content',TINTA[p]);
      for(var i=0;i<bottoni.length;i++){
        var b=bottoni[i];
        if(b.setAttribute) b.setAttribute('aria-pressed', (b.dataset&&b.dataset.p)===p ? 'true':'false');
      }
      if(salva){ try{ localStorage.setItem('pelle',p); }catch(e){} }
    }

    var salvata='attuale';
    try{ salvata=localStorage.getItem('pelle')||'attuale'; }catch(e){}
    applica(salvata,false);
    box.hidden=false;
    if(box.addEventListener) box.addEventListener('click',function(e){
      var n=e && e.target;
      while(n && n!==box && !(n.dataset && n.dataset.p)) n=n.parentNode;
      if(n && n.dataset && n.dataset.p) applica(n.dataset.p,true);
    });
  }catch(e){ /* pelle non applicata: la pagina resta quella di default */ }
})();
</script>
</body>
